server {
    listen 80;

    location ~* \.(env|sql|php|ini|cfg|bak|log)$ {
        return 404;
    }
    location ~* ^/(adminer|phpmyadmin|pma|dbadmin|sql|secrets|config|backup|mailjet) {
        return 404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
