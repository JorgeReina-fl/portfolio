server {
    listen 80;
    root /usr/share/nginx/html;

    location ~* \.(env|sql|php|ini|cfg|bak|log)$ {
        return 404;
    }
    location ~* ^/(adminer|phpmyadmin|pma|dbadmin|sql|secrets|config|backup|mailjet) {
        return 404;
    }

    # Rutas del SPA: mantener en sincronía con src/router/index.jsx
    location = / { try_files /index.html =404; }
    location ~ ^/(about|projects|contact)/?$ { try_files /index.html =404; }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri =404;
        error_page 404 /index.html;
    }
}
